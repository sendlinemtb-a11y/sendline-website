<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop — SENDLINE MTB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D0D; --bg-alt:#1A1A1A; --text:#EDEDED; --muted:#9A9A9A;
    --red:#8C1D1D; --line:rgba(237,237,237,0.12);
    --font-display:'Anton',sans-serif; --font-body:'Work Sans',sans-serif;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px;}

  nav{position:sticky;top:0;top:env(safe-area-inset-top,0px);background:rgba(13,13,13,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:10;}
  .nav-inner{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;max-width:1100px;margin:0 auto;}
  .logo{font-family:var(--font-display);font-size:20px;letter-spacing:0.5px;}
  .logo span{color:var(--red);}
  .nav-links a{font-size:14px;font-weight:600;color:var(--muted);}
  .nav-links a:hover{color:var(--text);}

  .products{padding:80px 24px;}
  .section-title{font-family:var(--font-display);font-size:clamp(30px,5vw,42px);margin-bottom:40px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);}
  .card{background:var(--bg);}
  .card-media{aspect-ratio:4/5;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--font-display);font-size:14px;}
  .card-body{padding:20px;border-top:1px solid var(--line);}
  .card-name{font-weight:700;margin-bottom:6px;}
  .card-price{color:var(--red);font-weight:700;margin-bottom:14px;}

  /*
    HOW TO ADD YOUR PRODUCTS:
    1. Shopify Admin > Sales channels > Buy Button
    2. Pick a product, click "Generate code"
    3. Paste it inside a <div class="buy-button-slot"> below
  */

  footer{padding:40px 24px calc(40px + env(safe-area-inset-bottom,0px));}
  .footer-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo">SEND<span>LINE</span></div>
    <div class="nav-links"><a href="index.html">Home</a></div>
  </div>
</nav>

<section class="products">
  <div class="wrap">
    <div class="section-title">The First Run</div>
    <div class="grid">

      <div class="card">
        <div class="card-media">Product photo</div>
        <div class="card-body">
          <div class="card-name">Full Send Tee</div>
          <div class="card-price">$32</div>
          <!-- PASTE YOUR SHOPIFY BUY BUTTON CODE BELOW -->
          <div class="buy-button-slot">Buy Button goes here</div>
        </div>
      </div>

      <div class="card">
        <div class="card-media">Product photo</div>
        <div class="card-body">
          <div class="card-name">No Brakes Hoodie</div>
          <div class="card-price">$58</div>
          <!-- PASTE YOUR SHOPIFY BUY BUTTON CODE BELOW -->
          <div class="buy-button-slot">Buy Button goes here</div>
        </div>
      </div>

    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div>&copy; 2026 SendLine MTB</div>
    <div>Shipping &nbsp;&middot;&nbsp; Returns &nbsp;&middot;&nbsp; Contact</div>
  </div>
</footer>

</body>
</html>
